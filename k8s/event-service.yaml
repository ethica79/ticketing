# Deployment: keeps 2 pods of event-service running (recreates them if they crash).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  labels:
    app: event-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: ethica79/event-service:1.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Kubernetes uses the Spring Actuator endpoints to know if the pod is OK.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
# Service: one stable name/address in front of the pods, load-balancing between them.
# NodePort = also reachable from outside the cluster (until we add a gateway in step 4).
apiVersion: v1
kind: Service
metadata:
  name: event-service
  labels:
    app: event-service
spec:
  type: NodePort
  selector:
    app: event-service
  ports:
    - name: http
      port: 8080
      targetPort: http
